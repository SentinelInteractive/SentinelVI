[package]
name = "sentinel-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local HTTP API and static host for SentinelVI"

[dependencies]
sentinel-core = { workspace = true }
sentinel-toc = { workspace = true }
sentinel-placement = { workspace = true }
sentinel-anim = { workspace = true }
axum = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs"] }
serde = { workspace = true }
serde_json = { workspace = true }
memmap2 = { workspace = true }
rusqlite = { workspace = true }

[[bin]]
name = "sentinel-server"
path = "src/main.rs"

